services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sslmonitor
      POSTGRES_USER: sslmonitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U sslmonitor -d sslmonitor"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sslmonitor:${POSTGRES_PASSWORD:-change-me}@db:5432/sslmonitor
    depends_on:
      db: {condition: service_healthy}
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
  scheduler:
    build:
      context: .
      target: scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sslmonitor:${POSTGRES_PASSWORD:-change-me}@db:5432/sslmonitor
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD","npm","run","scheduler:health"]
      interval: 2m
      timeout: 15s
      retries: 3
      start_period: 2m
volumes:
  postgres_data:
